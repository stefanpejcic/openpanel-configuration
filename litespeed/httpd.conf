# LiteSpeed Enterprise reads this Apache style config, its own server settings are in httpd_config.xml
# PHP runs in the bundled lsphp, the version comes with the image tag (LITESPEED_VERSION)

ServerName localhost
Listen 80
Listen 443

User nobody
Group nogroup

Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

ServerAdmin you@example.com
ServerTokens Prod
ServerSignature Off

<IfModule dir_module>
    DirectoryIndex index.php index.html
</IfModule>

<Files ".ht*">
    Require all denied
</Files>

AddHandler application/x-httpd-php .php

<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml text/javascript
    AddOutputFilterByType DEFLATE application/javascript application/x-javascript
    AddOutputFilterByType DEFLATE application/json application/xml application/rss+xml application/atom+xml
    AddOutputFilterByType DEFLATE application/xhtml+xml application/ld+json application/manifest+json
    AddOutputFilterByType DEFLATE image/svg+xml font/eot font/otf font/ttf
</IfModule>

RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16

IncludeOptional /etc/httpd/conf.d/*.conf
