<VirtualHost *:80>
    ServerName <DOMAIN_NAME>
    ServerAlias www.<DOMAIN_NAME>
    DocumentRoot <DOCUMENT_ROOT>

    <Directory <DOCUMENT_ROOT>>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php index.html

    # block hidden files and folders except .well-known (.git, .env, .htpasswd, .user.ini...)
    <LocationMatch "/\.(?!well-known/)">
        Require all denied
    </LocationMatch>

</VirtualHost>


<VirtualHost *:443>
    ServerName <DOMAIN_NAME>
    ServerAlias www.<DOMAIN_NAME>
    DocumentRoot <DOCUMENT_ROOT>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/cert.crt
    SSLCertificateKeyFile /etc/apache2/ssl/cert.key

    <Directory <DOCUMENT_ROOT>>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php index.html

    # block hidden files and folders except .well-known (.git, .env, .htpasswd, .user.ini...)
    <LocationMatch "/\.(?!well-known/)">
        Require all denied
    </LocationMatch>

</VirtualHost>
