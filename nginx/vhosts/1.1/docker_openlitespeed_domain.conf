docRoot                    <DOCUMENT_ROOT>
vhDomain                   <DOMAIN_NAME>
vhAliases                  www.<DOMAIN_NAME>
adminEmails                admin@<DOMAIN_NAME>
enableGzip                 1
indexFiles                 index.php, index.html
autoIndex                  1

rewrite  {
  enable                  1
  autoLoadHtaccess        1
  logLevel                1
  # block hidden files and folders except .well-known (.git, .env, .htpasswd, .user.ini...)
  rules                   <<<END_rules
RewriteRule "/\.(?!well-known/)" - [F,L]
  END_rules
}


