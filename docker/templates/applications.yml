# One-click Docker apps shown on the OpenPanel Auto Installer, each one prefills /containers/new.
# OpenPanel caches this file for 24h. {domain} in env values is replaced with the domain picked on the form.
#
# id           unique, lowercase
# service      default container name: lowercase letters and digits, at least 3 chars
# cpu/ram/pids default limits, ram in GB (or 512M)
# port         port the app listens on inside the container, used for the domain proxy
# networks     www is needed for a domain, db to reach the account's databases
# volumes      name:/path or name:/path:ro, names that don't exist yet are created
# env          KEY=value lines

applications:
  - id: uptime-kuma
    name: Uptime Kuma
    description: Self-hosted monitoring for websites, APIs and servers, with status pages and alerts.
    category: Monitoring
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/uptime-kuma.svg
    docs: https://github.com/louislam/uptime-kuma/wiki
    image: louislam/uptime-kuma:2
    service: uptimekuma
    cpu: "0.5"
    ram: "0.5"
    pids: 300
    port: 3001
    networks: [www]
    volumes:
      - uptimekuma_data:/app/data
    env:
      - TZ=UTC

  - id: n8n
    name: n8n
    description: Workflow automation, connect apps and APIs with a visual editor.
    category: Automation
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/n8n.svg
    docs: https://docs.n8n.io/hosting/
    image: n8nio/n8n:latest
    service: n8n
    cpu: "1"
    ram: "1"
    pids: 500
    port: 5678
    networks: [www, db]
    volumes:
      - n8n_data:/home/node/.n8n
    env:
      - N8N_HOST={domain}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://{domain}/
      - WEBHOOK_URL=https://{domain}/
      - GENERIC_TIMEZONE=UTC
      - N8N_RUNNERS_ENABLED=true

  - id: gitea
    name: Gitea
    description: Lightweight self-hosted Git service with issues, pull requests and CI.
    category: Development
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/gitea.svg
    docs: https://docs.gitea.com/installation/install-with-docker
    image: gitea/gitea:latest
    service: gitea
    cpu: "1"
    ram: "1"
    pids: 500
    port: 3000
    networks: [www, db]
    volumes:
      - gitea_data:/data
    env:
      - GITEA__server__DOMAIN={domain}
      - GITEA__server__ROOT_URL=https://{domain}/
      - GITEA__server__DISABLE_SSH=true

  - id: vaultwarden
    name: Vaultwarden
    description: Password manager compatible with the Bitwarden apps and browser extensions.
    category: Security
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/vaultwarden.svg
    docs: https://github.com/dani-garcia/vaultwarden/wiki
    image: vaultwarden/server:latest
    service: vaultwarden
    cpu: "0.5"
    ram: "0.5"
    pids: 200
    port: 80
    networks: [www]
    volumes:
      - vaultwarden_data:/data
    env:
      - DOMAIN=https://{domain}
      - SIGNUPS_ALLOWED=true

  - id: memos
    name: Memos
    description: Privacy-first note taking, a lightweight place for quick notes and knowledge.
    category: Productivity
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/memos.svg
    docs: https://www.usememos.com/docs
    image: neosmemo/memos:stable
    service: memos
    cpu: "0.5"
    ram: "0.5"
    pids: 200
    port: 5230
    networks: [www]
    volumes:
      - memos_data:/var/opt/memos

  - id: weblate
    name: Weblate
    description: Web-based translation tool with Git sync, for translating software and documentation. Needs about 2 GB of free RAM on the plan and the account's PostgreSQL and Redis services, create a PostgreSQL database and user first and put them in the POSTGRES_ values.
    category: Development
    logo: https://cdn.jsdelivr.net/gh/WeblateOrg/weblate/weblate/static/weblate.svg
    docs: https://docs.weblate.org/en/latest/admin/install/docker.html
    image: weblate/weblate:latest
    service: weblate
    cpu: "1"
    ram: "2"
    pids: 500
    port: 8080
    networks: [www, db]
    volumes:
      - weblate_data:/app/data
      - weblate_cache:/app/cache
    env:
      - WEBLATE_SITE_DOMAIN={domain}
      - WEBLATE_SITE_TITLE=Weblate
      - WEBLATE_ADMIN_NAME=Admin
      - WEBLATE_ADMIN_EMAIL=admin@{domain}
      - WEBLATE_ADMIN_PASSWORD=change-this-password
      - WEBLATE_SERVER_EMAIL=noreply@{domain}
      - WEBLATE_DEFAULT_FROM_EMAIL=noreply@{domain}
      - WEBLATE_ENABLE_HTTPS=1
      - WEBLATE_IP_PROXY_HEADER=HTTP_X_FORWARDED_FOR
      - WEBLATE_SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      - WEBLATE_WORKERS=1
      - WEBLATE_TIME_ZONE=UTC
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=weblate
      - POSTGRES_USER=weblate
      - POSTGRES_PASSWORD=change-this-password
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  - id: open-webui
    name: Open WebUI
    description: ChatGPT-style web interface for AI models, connects to OpenAI-compatible APIs and Ollama. The first account you register becomes the admin.
    category: AI
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/open-webui.svg
    docs: https://docs.openwebui.com/
    image: ghcr.io/open-webui/open-webui:main
    service: openwebui
    cpu: "1"
    ram: "1.5"
    pids: 500
    port: 8080
    networks: [www]
    volumes:
      - openwebui_data:/app/backend/data
    env:
      - WEBUI_URL=https://{domain}
      - ENABLE_OLLAMA_API=false

  - id: langflow
    name: Langflow
    description: Visual builder for AI agents and RAG workflows, drag and drop components and serve them as an API. Log in with the LANGFLOW_SUPERUSER values.
    category: AI
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/langflow.png
    docs: https://docs.langflow.org/
    image: langflowai/langflow:latest
    service: langflow
    cpu: "1"
    ram: "2"
    pids: 500
    port: 7860
    networks: [www]
    volumes:
      - langflow_data:/app/langflow
    env:
      - LANGFLOW_CONFIG_DIR=/app/langflow
      - LANGFLOW_DATABASE_URL=sqlite:////app/langflow/langflow.db
      - LANGFLOW_AUTO_LOGIN=false
      - LANGFLOW_SUPERUSER=admin
      - LANGFLOW_SUPERUSER_PASSWORD=change-this-password

  - id: excalidraw
    name: Excalidraw
    description: Virtual whiteboard for hand-drawn style diagrams and sketches, drawings are kept in the browser or exported as files.
    category: Productivity
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/excalidraw.svg
    docs: https://github.com/excalidraw/excalidraw
    image: excalidraw/excalidraw:latest
    service: excalidraw
    cpu: "0.25"
    ram: "256M"
    pids: 100
    port: 80
    networks: [www]

  - id: stirling-pdf
    name: Stirling PDF
    description: Web toolbox for PDF files, merge, split, convert, compress, sign and OCR, files are processed on your server. Log in as admin with password stirling and change it right away.
    category: Productivity
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/stirling-pdf.svg
    docs: https://docs.stirlingpdf.com/
    image: stirlingtools/stirling-pdf:latest
    service: stirlingpdf
    cpu: "1"
    ram: "1.5"
    pids: 500
    port: 8080
    networks: [www]
    volumes:
      - stirlingpdf_configs:/configs
    env:
      - LANGS=en_GB

  - id: nextchat
    name: NextChat
    description: Lightweight ChatGPT-style chat for OpenAI and other providers. Put your API key in OPENAI_API_KEY and a password in CODE, visitors need that password to use your key.
    category: AI
    logo: https://cdn.jsdelivr.net/gh/ChatGPTNextWeb/NextChat/public/android-chrome-192x192.png
    docs: https://github.com/ChatGPTNextWeb/NextChat
    image: yidadaa/chatgpt-next-web:latest
    service: nextchat
    cpu: "0.5"
    ram: "512M"
    pids: 200
    port: 3000
    networks: [www]
    env:
      - OPENAI_API_KEY=
      - CODE=change-this-password

  - id: grafana
    name: Grafana
    description: Dashboards and alerts for metrics, logs and databases, connects to Prometheus, MySQL, PostgreSQL and many other sources. Log in with the GF_SECURITY_ADMIN values.
    category: Monitoring
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/grafana.svg
    docs: https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
    image: grafana/grafana-oss:latest
    service: grafana
    cpu: "0.5"
    ram: "512M"
    pids: 300
    port: 3000
    networks: [www, db]
    volumes:
      - grafana_data:/var/lib/grafana
    env:
      - GF_SERVER_ROOT_URL=https://{domain}/
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=change-this-password
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_REPORTING_ENABLED=false

  - id: anythingllm
    name: AnythingLLM
    description: Chat with your documents using any LLM provider, with workspaces, RAG and AI agents. You pick the LLM and set the admin password in the setup wizard.
    category: AI
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/anything-llm.svg
    docs: https://docs.anythingllm.com/installation-docker/overview
    image: mintplexlabs/anythingllm:latest
    service: anythingllm
    cpu: "1"
    ram: "1.5"
    pids: 500
    port: 3001
    networks: [www]
    volumes:
      - anythingllm_storage:/app/server/storage
    env:
      - STORAGE_DIR=/app/server/storage

  - id: nocodb
    name: NocoDB
    description: Spreadsheet-style interface on top of a database, an open source Airtable alternative. Data is kept in SQLite in the volume, the first account you sign up with becomes the owner.
    category: Productivity
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/nocodb.svg
    docs: https://nocodb.com/docs/self-hosting/installation/docker
    image: nocodb/nocodb:latest
    service: nocodb
    cpu: "0.5"
    ram: "1"
    pids: 300
    port: 8080
    networks: [www, db]
    volumes:
      - nocodb_data:/usr/app/data
    env:
      - NC_PUBLIC_URL=https://{domain}
      - NC_DISABLE_TELE=true

  - id: litellm
    name: LiteLLM
    description: OpenAI-compatible gateway in front of 100+ LLM providers, with virtual keys, budgets and usage tracking. Needs the account's PostgreSQL service, create a database and user first and put them in DATABASE_URL. Log in to /ui as admin with the LITELLM_MASTER_KEY.
    category: AI
    logo: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/litellm.svg
    docs: https://docs.litellm.ai/docs/proxy/deploy
    image: ghcr.io/berriai/litellm:main-stable
    service: litellm
    cpu: "1"
    ram: "1"
    pids: 500
    port: 4000
    networks: [www, db]
    env:
      - DATABASE_URL=postgresql://litellm:change-this-password@postgres:5432/litellm
      - LITELLM_MASTER_KEY=sk-change-this-key
      - LITELLM_SALT_KEY=sk-change-this-salt
      - STORE_MODEL_IN_DB=True

  - id: pocketbase
    name: PocketBase
    description: Open source backend in one file, with a realtime database, authentication, file storage and an admin dashboard at /_/. Create the first superuser with the setup link printed in the container logs.
    category: Development
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/pocketbase.svg
    docs: https://pocketbase.io/docs/
    image: ghcr.io/muchobien/pocketbase:latest
    service: pocketbase
    cpu: "0.5"
    ram: "256M"
    pids: 200
    port: 8090
    networks: [www]
    volumes:
      - pocketbase_data:/pb_data
      - pocketbase_public:/pb_public

  - id: meilisearch
    name: Meilisearch
    description: Fast search engine with a REST API, typo tolerance and filters, for adding search to websites and apps. Set a MEILI_MASTER_KEY of at least 16 characters, API requests need it.
    category: Development
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/meilisearch.svg
    docs: https://www.meilisearch.com/docs/learn/self_hosted/install_meilisearch_locally
    image: getmeili/meilisearch:latest
    service: meilisearch
    cpu: "0.5"
    ram: "512M"
    pids: 200
    port: 7700
    networks: [www]
    volumes:
      - meilisearch_data:/meili_data
    env:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=change-this-master-key
      - MEILI_NO_ANALYTICS=true

  - id: jellyfin
    name: Jellyfin
    description: Media server for your movies, shows and music, streams to browsers, phones and TVs. Put your media in the jellyfin_media volume, the setup wizard creates the admin account.
    category: Media
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/jellyfin.svg
    docs: https://jellyfin.org/docs/general/installation/container
    image: jellyfin/jellyfin:latest
    service: jellyfin
    cpu: "1"
    ram: "1"
    pids: 500
    port: 8096
    networks: [www]
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - jellyfin_media:/media
    env:
      - JELLYFIN_PublishedServerUrl=https://{domain}

  - id: joplin
    name: Joplin Server
    description: Sync server for the Joplin note taking apps, with sharing and note publishing. Needs the account's PostgreSQL service, create a database and user first and put them in the POSTGRES_ values. Log in as admin@localhost with password admin and change it.
    category: Productivity
    logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/joplin.svg
    docs: https://github.com/laurent22/joplin/blob/dev/packages/server/README.md
    image: joplin/server:latest
    service: joplin
    cpu: "0.5"
    ram: "512M"
    pids: 300
    port: 22300
    networks: [www, db]
    env:
      - APP_BASE_URL=https://{domain}
      - APP_PORT=22300
      - DB_CLIENT=pg
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=joplin
      - POSTGRES_USER=joplin
      - POSTGRES_PASSWORD=change-this-password
