# opencli domains-ratelimit
# requests per minute, per visitor IP and per domain, for domains with `import ratelimit <domain>`; 0 = off
# default: 300 6000
#
# zone names carry the domain because caddy-ratelimit shares a zone's state by name across all sites, so a per-domain override would change everyone's limit,
# and the limit, because raising a limit on a live zone keeps blocking until its oldest hit leaves the window (SetMaxEvents resets the cursor)

(ratelimit_ip) {
    rate_limit {
        zone ip_{args[1]}_{args[0]} {
            key {client_ip}
            events {args[0]}
            window 1m
        }
    }
}

(ratelimit_site) {
    rate_limit {
        zone site_{args[1]}_{args[0]} {
            key {host}
            events {args[0]}
            window 1m
        }
    }
}

# server default, args[0] = domain
(ratelimit) {
    import ratelimit_ip 300 {args[0]}
    import ratelimit_site 6000 {args[0]}
}
