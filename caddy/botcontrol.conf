# AI & bot crawler control snippets for per-domain Caddy configs

(ai_crawler_matcher) {
    @ai_crawlers {
        header_regexp ai_ua User-Agent (?i)(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|anthropic-ai|Bytespider|CCBot|PerplexityBot|Perplexity-User|Amazonbot|Meta-ExternalAgent|Meta-ExternalFetcher|FacebookBot|Google-Extended|Applebot-Extended|Diffbot|Omgilibot|cohere-ai|YouBot|DuckAssistBot|Timpibot|Scrapy)
    }
}

(botcontrol_block) {
    import ai_crawler_matcher
    respond @ai_crawlers "Forbidden" 403
}

(botcontrol_ratelimit) {
    import ai_crawler_matcher
    handle @ai_crawlers {
        rate_limit {
            zone botcontrol_{args[0]} {
                key {client_ip}
                events 10
                window 1m
            }
        }
    }
}
